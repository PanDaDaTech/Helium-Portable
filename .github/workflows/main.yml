name: CI

on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00, Beijing 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
      chrome_plus_ver: ${{ steps.compare.outputs.chrome_plus_ver }}
      helium_tag: ${{ steps.compare.outputs.helium_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare versions
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 仓库自带的 Chrome++ 配置必须存在（构建时要覆盖上游的同名文件）
          if [[ ! -f vendor/chrome_plus/chrome++.ini ]]; then
            echo "::error::vendor/chrome_plus/chrome++.ini not found"
            exit 1
          fi

          # 本仓库当前 release；首次构建时不存在，属正常情况
          cur_ver="$(gh release view --repo "${{ github.repository }}" --json tagName -q '.tagName' 2>/dev/null || echo "")"

          # 上游 Helium Windows 最新 release。这里失败必须显式报错，
          # 否则空值会被当成「版本相同」而静默跳过构建。
          latest_helium="$(gh release view --repo imputnet/helium-windows --json tagName -q '.tagName' 2>/dev/null || echo "")"
          if [[ -z "$latest_helium" ]]; then
            echo "::error::无法读取 imputnet/helium-windows 的最新 release（上游改名/网络/token 问题）"
            exit 1
          fi
          latest_helium="${latest_helium#v}"

          # 上游 Chrome++ 最新 release。Bush2021 的账号曾在 2026-09 被冻结，
          # 当时改成了仓库自带；现已恢复，改回跟随上游。
          # 同样必须显式判空：空值会被当成「版本相同」而永远不出包。
          latest_plus="$(gh release view --repo Bush2021/chrome_plus --json tagName -q '.tagName' 2>/dev/null || echo "")"
          if [[ -z "$latest_plus" ]]; then
            echo "::error::无法读取 Bush2021/chrome_plus 的最新 release（上游可能再次不可用）"
            exit 1
          fi
          latest_plus="${latest_plus#v}"

          echo "chrome_plus_ver=$latest_plus" >> "$GITHUB_OUTPUT"
          echo "helium_tag=$latest_helium" >> "$GITHUB_OUTPUT"

          # 从现有 release tag 解析出 {helium}+{chrome_plus}
          cur_helium=""
          cur_plus=""
          if [[ "$cur_ver" == *"+"* ]]; then
            cur_helium="${cur_ver%%+*}"; cur_helium="${cur_helium#v}"
            cur_plus="${cur_ver#*+}"
          fi

          should_run=""
          reason="helium and chrome_plus are up to date"
          if [[ -z "$cur_ver" || -z "$cur_helium" ]]; then
            should_run="true"
            reason="current release is missing or not in helium+chrome_plus format"
          elif [[ "$cur_helium" != "$latest_helium" ]]; then
            should_run="true"
            reason="helium changed: current=$cur_helium latest=$latest_helium"
          elif [[ "$cur_plus" != "$latest_plus" ]]; then
            should_run="true"
            reason="chrome_plus changed: current=$cur_plus latest=$latest_plus"
          fi

          echo "current_release=${cur_ver:-<none>}"
          echo "current_helium=${cur_helium:-<none>}"
          echo "latest_helium=$latest_helium"
          echo "latest_chrome_plus=$latest_plus"
          echo "should_run=${should_run:-false} ($reason)"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.should_run || github.event_name == 'workflow_dispatch' }}
    steps:
      # 需要 checkout 才能拿到 vendor/chrome_plus/chrome++.ini 与 config/initial_preferences
      - uses: actions/checkout@v7

      - name: Download Helium x64
        uses: robinraju/release-downloader@v1
        with:
          repository: imputnet/helium-windows
          tag: ${{ needs.check.outputs.helium_tag }}
          fileName: 'helium_*_x64-installer.exe'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Helium arm64
        uses: robinraju/release-downloader@v1
        with:
          repository: imputnet/helium-windows
          tag: ${{ needs.check.outputs.helium_tag }}
          fileName: 'helium_*_arm64-installer.exe'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Chrome++
        uses: robinraju/release-downloader@v1
        with:
          repository: Bush2021/chrome_plus
          tag: ${{ needs.check.outputs.chrome_plus_ver }}
          fileName: 'Chrome++_*_x86_x64_arm64.7z'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Verify Chrome++ payload
        shell: bash
        run: |
          set -euo pipefail

          cpp_archive="$(find . -maxdepth 1 -name 'Chrome++_*.7z' -printf '%f\n' | head -1)"
          if [[ -z "$cpp_archive" ]]; then
            echo "::error::Chrome++ archive not found in workspace"
            ls -la
            exit 1
          fi
          echo "Chrome++ archive: $cpp_archive"

          rm -rf chrome_plus_extract
          7z x "$cpp_archive" -ochrome_plus_extract -y

          # 上游布局：{x64,arm64,x86}/App/{chrome++.ini,version.dll}
          for arch in x64 arm64; do
            if [[ ! -f "chrome_plus_extract/$arch/App/version.dll" ]]; then
              echo "::error::missing chrome_plus_extract/$arch/App/version.dll（上游包结构可能变了）"
              find chrome_plus_extract -maxdepth 3 | sort
              exit 1
            fi
          done

          # 校验 DLL 是合法 PE 且架构正确，避免上游换包/换名后静默塞错文件
          python3 - <<'PY'
          import struct, sys

          expected = {"x64": 0x8664, "arm64": 0xAA64}
          ok = True
          for arch, want in expected.items():
              path = f"chrome_plus_extract/{arch}/App/version.dll"
              data = open(path, "rb").read()
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              valid_pe = data[:2] == b"MZ" and data[pe:pe + 4] == b"PE\0\0"
              machine = struct.unpack_from("<H", data, pe + 4)[0]
              name = {0x8664: "x64", 0xAA64: "arm64", 0x14C: "x86"}.get(machine, hex(machine))
              print(f"{arch}: {len(data)} bytes, machine={name}, PE={valid_pe}")
              if not valid_pe or machine != want:
                  print(f"::error::Chrome++ {arch} payload is not a valid {arch} PE")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

          # 配置漂移检查：仓库里的 chrome++.ini 是 1.20.0 的快照（仅多一行 command_line）。
          # 上游若新增了配置项，我们这份会缺失，Chrome++ 会静默回退默认值——只告警，不阻断构建。
          python3 - <<'PY'
          import re

          def keys_of(path):
              text = open(path, "rb").read().decode("utf-16")
              section, out = "", set()
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith(";"):
                      continue
                  m = re.fullmatch(r"\[(.+)\]", line)
                  if m:
                      section = m.group(1)
                      continue
                  if "=" in line:
                      out.add(f"{section}|{line.split('=', 1)[0].strip()}")
              return out

          ours = keys_of("vendor/chrome_plus/chrome++.ini")
          theirs = keys_of("chrome_plus_extract/x64/App/chrome++.ini")
          missing = sorted(theirs - ours)
          extra = sorted(ours - theirs)
          print(f"配置项: 本地 {len(ours)} / 上游 {len(theirs)}")
          if extra:
              print("本地独有（预期存在，如 command_line 的自定义参数）: " + ", ".join(extra))
          for key in missing:
              print(f"::warning::上游 chrome++.ini 新增了配置项 {key}，本地快照缺失，将回退默认值")
          if not missing:
              print("无配置漂移")
          PY

          # 种子配置只在「首次运行」被读取，而 --no-first-run 会让浏览器判定为「非首次运行」，
          # 导致 initial_preferences 被完全忽略且没有任何报错。这是静默失效，必须硬拦。
          python3 - <<'PY'
          import sys

          text = open("vendor/chrome_plus/chrome++.ini", "rb").read().decode("utf-16")
          bad = [l for l in text.splitlines() if l.startswith("command_line=") and "--no-first-run" in l]
          if bad:
              print("::error::chrome++.ini 的 command_line 含有 --no-first-run，"
                    "会导致 App/initial_preferences 被完全忽略（默认搜索引擎/更新开关全部失效）")
              sys.exit(1)
          print("command_line 检查通过：未包含 --no-first-run")
          PY

      - name: Build portable packages
        id: build
        shell: bash
        run: |
          set -euo pipefail

          plus_ver="${{ needs.check.outputs.chrome_plus_ver }}"

          # Parse versions from filenames
          helium_x64_exe="$(find . -maxdepth 1 -name 'helium_*_x64-installer.exe' -printf '%f\n' | head -1)"
          helium_arm64_exe="$(find . -maxdepth 1 -name 'helium_*_arm64-installer.exe' -printf '%f\n' | head -1)"
          if [[ -z "$helium_x64_exe" || -z "$helium_arm64_exe" ]]; then
            echo "::error::helium installer not found in workspace"
            ls -la
            exit 1
          fi
          helium_ver="${helium_x64_exe#helium_}"; helium_ver="${helium_ver%_x64-installer.exe}"; helium_ver="${helium_ver#v}"
          release_tag="${helium_ver}+${plus_ver}"

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "x64_package_dir=helium_${release_tag}_x64-windows" >> "$GITHUB_OUTPUT"
          echo "arm64_package_dir=helium_${release_tag}_arm64-windows" >> "$GITHUB_OUTPUT"

          # Extract exe installers with 7z (NSIS outer layer)
          7z x "$helium_x64_exe" -ohelium_x64_extract
          7z x "$helium_arm64_exe" -ohelium_arm64_extract

          # NSIS installers contain nested archives — extract iteratively until browser files appear
          for arch in x64 arm64; do
            mkdir -p "helium_${arch}_files"
            # First pass: extract inner archive from NSIS output
            inner_archive="$(find "helium_${arch}_extract" -name '*.7z' -o -name '*.7z.001' | sort | head -1)"
            if [[ -n "$inner_archive" ]]; then
              echo "Extracting: $inner_archive"
              7z x "$inner_archive" "-ohelium_${arch}_files" -aoa
            fi
            # Keep extracting if the result is still an archive (nested 7z)
            while true; do
              nested="$(find "helium_${arch}_files" -maxdepth 1 \( -name '*.7z' -o -name '*.7z.001' \) | sort | head -1)"
              [[ -z "$nested" ]] && break
              echo "Extracting nested archive: $nested"
              7z x "$nested" "-ohelium_${arch}_files" -aoa
              rm -f "$nested"
            done
          done

          for arch in x64 arm64; do
            echo "=== Building $arch package ==="
            package_dir="helium_${release_tag}_${arch}-windows"

            # Locate helium source dir for current arch
            helium_root="$(dirname "$(find "helium_${arch}_files" -name 'chrome.exe' -print -quit 2>/dev/null)")"
            if [[ -z "$helium_root" || "$helium_root" == "." ]]; then
              echo "ERROR: chrome.exe not found in helium_${arch}_files"
              echo "--- Directory tree (depth 3) ---"
              find "helium_${arch}_files" -maxdepth 3 | head -50
              exit 1
            fi

            # Assemble package: Chrome++ 目录内容落在根目录，Helium 落在 App/
            mkdir -p "$package_dir"
            mkdir -p "$package_dir/App"
            cp -a "$helium_root/." "$package_dir/App/"

            # Chrome++ 载荷：version.dll 取自上游，chrome++.ini 用仓库里的版本覆盖上游的
            cp -a "chrome_plus_extract/${arch}/App/version.dll" "$package_dir/App/"
            cp -a "vendor/chrome_plus/chrome++.ini" "$package_dir/App/"
            # 首启种子配置：默认搜索引擎 / 搜索引擎列表 / 关闭自动更新
            cp -a "config/initial_preferences" "$package_dir/App/"

            # 便携化运行期需要的空目录（不依赖 git 能存空目录）
            mkdir -p "$package_dir/Cache" "$package_dir/Data"

            # Keep only zh-CN and en-US locales (search recursively for locales dirs)
            find "$package_dir/App" -type d -iname 'locales' | while read -r locales_dir; do
              echo "Cleaning locales: $locales_dir"
              find "$locales_dir" -type f ! -name 'zh-CN.pak' ! -name 'en-US.pak' -delete
            done

            # Version marker
            touch "$package_dir/$release_tag"

            # Verify
            test -f "$package_dir/App/chrome.exe"
            test -f "$package_dir/App/chrome++.ini"
            test -f "$package_dir/App/version.dll"
            test -f "$package_dir/App/initial_preferences"
            test -d "$package_dir/Cache"
            test -d "$package_dir/Data"
            echo "Package built: $package_dir"
            ls "$package_dir"
          done

      # 不保留 CI artifact：产物已经在 Release 附件里（7z），再存一份纯属重复，
      # 而 artifact 会吃 GitHub Actions 存储配额（本账户曾因此把上传全堵死）。
      # 构建失败要排查时看 Actions 日志即可。

      - name: Create release archives
        shell: bash
        run: |
          7z a "${{ steps.build.outputs.x64_package_dir }}.7z" "${{ steps.build.outputs.x64_package_dir }}"
          7z a "${{ steps.build.outputs.arm64_package_dir }}.7z" "${{ steps.build.outputs.arm64_package_dir }}"

      - name: Publish release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.build.outputs.release_tag }}"
          plus_ver="${tag#*+}"
          repo="${{ github.repository }}"
          assets=("${{ steps.build.outputs.x64_package_dir }}.7z" "${{ steps.build.outputs.arm64_package_dir }}.7z")

          # 判断该 tag 是否已有 release。**必须扫全量列表**：
          # GET /releases/tags/{tag} 不会返回草稿（草稿发布前没有 tag 对象），
          # 对已存在的草稿会误报 404，结果每跑一次就多一个重复草稿。
          state=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/releases?per_page=100" \
            | python3 -c "
          import json, sys
          tag = sys.argv[1]
          for r in json.load(sys.stdin):
              if r['tag_name'] == tag:
                  print('draft' if r['draft'] else 'published')
                  break
          else:
              print('absent')
          " "$tag")

          case "$state" in
            draft)
              echo "已有草稿 $tag，覆盖上传后转正"
              gh release upload "$tag" "${assets[@]}" --clobber --repo "$repo"
              gh release edit "$tag" --draft=false --latest --repo "$repo"
              ;;
            published)
              echo "Release $tag 已发布，仅覆盖上传附件"
              gh release upload "$tag" "${assets[@]}" --clobber --repo "$repo"
              ;;
            absent)
              gh release create "$tag" "${assets[@]}" \
                --repo "$repo" \
                --title "$tag" \
                --latest \
                --notes "Portable Helium packaged with Chrome++. Available for x64 and arm64.
          Release follows Helium Windows and Chrome++ updates.

          Sources: [Helium Windows](https://github.com/imputnet/helium-windows) | [Chrome++ $plus_ver](https://github.com/Bush2021/chrome_plus/releases/tag/$plus_ver)"
              ;;
          esac

      - name: Publish draft (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.build.outputs.release_tag }}"
          repo="${{ github.repository }}"
          assets=("${{ steps.build.outputs.x64_package_dir }}.7z" "${{ steps.build.outputs.arm64_package_dir }}.7z")

          # 手动触发只做草稿，绝不自动转正；已存在（含草稿）则覆盖附件
          state=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/releases?per_page=100" \
            | python3 -c "
          import json, sys
          tag = sys.argv[1]
          for r in json.load(sys.stdin):
              if r['tag_name'] == tag:
                  print('exists')
                  break
          else:
              print('absent')
          " "$tag")

          if [[ "$state" == "exists" ]]; then
            echo "Release $tag 已存在，覆盖上传附件（保持草稿状态）"
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$repo"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$repo" \
              --title "$tag" \
              --draft \
              --notes "Manually triggered draft release. Available for x64 and arm64.

          Sources: [Helium Windows](https://github.com/imputnet/helium-windows) | [Chrome++](https://github.com/Bush2021/chrome_plus)"
          fi
